# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "2"
members = [
    "crates/cli-core",
    "crates/cli-pc",
    "crates/upcli",
    "crates/window",
    "crates/pc-session-tests",
    "crates/ui-kit",
    "crates/library-model",
    "crates/library-ui",
    "crates/media-ui",
    "crates/pc-media",
    "crates/pc-library",
    "crates/pc-ui",
    "crates/media",
    "crates/image-store",
    "crates/registry",
    "crates/pc-image",
    "crates/platforms",
    "crates/recipe",
    "crates/core-launch",
    "crates/player-ui",
]

[workspace.package]
version = "0.0.4"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.99"
repository = "https://github.com/unemu-org/unemu"
# Workspace crate names (cpu, bus, device, machine, cli, window, ...) collide
# with unrelated crates on crates.io; nothing here is published there.
publish = false

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde-saphyr = { version = "=2.1.1", default-features = false, features = ["deserialize"] }
# Library error enums (§conventions: thiserror for stable library errors).
thiserror = "1"
# Frontend/test-only error plumbing.
anyhow = "1"
# SHA-256 for media image identity.
sha2 = "0.10"
winit = "0.30"
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
# `clipboard` gives egui-winit the host clipboard (arboard; smithay-clipboard on
# Wayland) instead of a string that lives only inside the app.
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "x11", "wayland"] }
cpal = "=0.18.2"
# The contract between front ends and emulator cores, at the commit of release
# v0.2.0. Every core and front end in one build must link the same copy, so the
# pin is an exact revision, moved together with every pinned core. A bare path
# dependency breaks nix build and CI. To develop against a local checkout of the
# contract, add a gitignored [patch] override instead of editing this line.
unemu-core-api = { version = "0.3", git = "https://github.com/unemu-org/unemu-core-api", rev = "afba6e6b217946eb57b9556e79a30bbe53c90fb4" }
# The contract's storage and content over host files, from the contract's
# repository at the same revision: it depends on that copy of the contract.
unemu-core-files = { version = "0.3", git = "https://github.com/unemu-org/unemu-core-api", rev = "afba6e6b217946eb57b9556e79a30bbe53c90fb4" }
# The NES core, from its own repository at an exact revision built against the
# same release of the contract as the pin above: one copy of the contract in the
# build. Moving this pin moves the NES golden's revision too. A bare path
# dependency breaks nix build and CI; develop against a local checkout through a
# gitignored [patch] override instead of editing this line.
unemu-nes-core = { version = "0.0.1", git = "https://github.com/unemu-org/unemunes", rev = "0dbf0d56c627ab62601fca1dcd64ec77f3e4643c" }

# The PC core, from its own repository at one exact revision of its main with
# green CI, the same revision in every line (repo-split.md §4.1). Never a bare
# path, a branch or a tag; develop against a local core checkout through a
# gitignored [patch] override. Moving this revision is a re-pin bead.
assembly = { version = "0.0.4", git = "https://github.com/unemu-org/unemupc", rev = "bba8ca6b4117fde9bc3880c5a3d5872cd6e644de" }
audio = { version = "0.0.4", git = "https://github.com/unemu-org/unemupc", rev = "bba8ca6b4117fde9bc3880c5a3d5872cd6e644de" }
cpu = { version = "0.0.4", git = "https://github.com/unemu-org/unemupc", rev = "bba8ca6b4117fde9bc3880c5a3d5872cd6e644de" }
device = { version = "0.0.4", git = "https://github.com/unemu-org/unemupc", rev = "bba8ca6b4117fde9bc3880c5a3d5872cd6e644de" }
devices = { version = "0.0.4", git = "https://github.com/unemu-org/unemupc", rev = "bba8ca6b4117fde9bc3880c5a3d5872cd6e644de" }
journal-files = { version = "0.0.4", git = "https://github.com/unemu-org/unemupc", rev = "bba8ca6b4117fde9bc3880c5a3d5872cd6e644de" }
machine = { version = "0.0.4", git = "https://github.com/unemu-org/unemupc", rev = "bba8ca6b4117fde9bc3880c5a3d5872cd6e644de" }
machine-file = { version = "0.0.4", git = "https://github.com/unemu-org/unemupc", rev = "bba8ca6b4117fde9bc3880c5a3d5872cd6e644de" }
pc-config = { version = "0.0.4", git = "https://github.com/unemu-org/unemupc", rev = "bba8ca6b4117fde9bc3880c5a3d5872cd6e644de" }
pc-harness = { version = "0.0.4", git = "https://github.com/unemu-org/unemupc", rev = "bba8ca6b4117fde9bc3880c5a3d5872cd6e644de" }
unemu-pc-core = { version = "0.0.4", git = "https://github.com/unemu-org/unemupc", rev = "bba8ca6b4117fde9bc3880c5a3d5872cd6e644de" }
unemupc = { version = "0.0.4", git = "https://github.com/unemu-org/unemupc", rev = "bba8ca6b4117fde9bc3880c5a3d5872cd6e644de" }
video = { version = "0.0.4", git = "https://github.com/unemu-org/unemupc", rev = "bba8ca6b4117fde9bc3880c5a3d5872cd6e644de" }

# Internal crates share the workspace version.
media = { path = "crates/media", version = "0.0.4" }
machine-view = { version = "0.0.4", git = "https://github.com/unemu-org/unemu-host", rev = "cac0317b2bf5fe1c02357eb6119dd9916283edf9" }
unemu-test-core = { version = "0.0.4", git = "https://github.com/unemu-org/unemu-host", rev = "cac0317b2bf5fe1c02357eb6119dd9916283edf9" }

# Keep hardware preconditions and arithmetic checked even in optimized dev/test code.
[profile.dev]
debug-assertions = true
overflow-checks = true

# The CPU core and its decoder dominate instruction execution in dev/test builds.
[profile.dev.package."*"]
opt-level = 3

# Optimize the emulation loop while leaving frontends and test drivers unoptimized
# for debugging. The test profile inherits these optimization settings.
[profile.dev.package.media]
opt-level = 3
