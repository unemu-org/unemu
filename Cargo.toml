# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "2"
members = [
    "crates/device",
    "crates/bus",
    "crates/chipset",
    "crates/cpu",
    "crates/machine",
    "crates/devices",
    "crates/video",
    "crates/audio",
    "crates/assembly",
    "crates/testkit",
    "crates/cli",
    "crates/window",
    "crates/media",
    "crates/machine-file",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.99"
repository = "https://github.com/mikolajmikolajczyk/unemupc98"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde-saphyr = { version = "=2.1.1", default-features = false, features = ["deserialize"] }
# Library error enums (§conventions: thiserror for stable library errors).
thiserror = "1"
# Frontend/test-only error plumbing.
anyhow = "1"
# SHA-256 for media image identity.
sha2 = "0.10"
winit = "0.30"
cpal = "=0.18.2"
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
# CPU core: faster ordinary real-mode execution and saved NT restoration on task switches.
# Every build and golden trace runs against a known CPU. A bare path dependency breaks
# nix build and CI. To develop against a local x86jit checkout, add a gitignored
# [patch] override instead of editing this line.
x86jit-core = { version = "0.3", git = "https://git.lab.mikolajczyk.org/unemu-org/x86jit", rev = "fe240a56ac2040e3deaebb2537e642137ee02c71" }

# Internal crates share the workspace version.
assembly = { path = "crates/assembly", version = "0.1.0" }
device = { path = "crates/device", version = "0.1.0" }
bus = { path = "crates/bus", version = "0.1.0" }
chipset = { path = "crates/chipset", version = "0.1.0" }
cpu = { path = "crates/cpu", version = "0.1.0" }
machine = { path = "crates/machine", version = "0.1.0" }
machine-file = { path = "crates/machine-file", version = "0.1.0" }
media = { path = "crates/media", version = "0.1.0" }
devices = { path = "crates/devices", version = "0.1.0" }
video = { path = "crates/video", version = "0.1.0" }
audio = { path = "crates/audio", version = "0.1.0" }
testkit = { path = "crates/testkit", version = "0.1.0" }

# Optimize dependencies (the CPU core and its decoder) even in dev/test builds,
# because emulator tests spend most of their time inside them. Workspace crates
# stay unoptimized with debug assertions and overflow checks.
[profile.dev.package."*"]
opt-level = 3
