# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "2"
members = [
    "crates/device",
    "crates/bus",
    "crates/chipset",
    "crates/cpu",
    "crates/machine",
    "crates/devices",
    "crates/video",
    "crates/audio",
    "crates/assembly",
    "crates/testkit",
    "crates/cli-core",
    "crates/cli-pc",
    "crates/upcli",
    "crates/pc-harness",
    "crates/window",
    "crates/ui-kit",
    "crates/library-model",
    "crates/library-ui",
    "crates/pc-core",
    "crates/machine-view",
    "crates/pc-media",
    "crates/pc-library",
    "crates/media",
    "crates/machine-file",
    "crates/image-store",
    "crates/registry",
    "crates/pc-image",
    "crates/platforms",
    "crates/recipe",
]

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.99"
repository = "https://github.com/unemu-org/unemupc"
# Workspace crate names (cpu, bus, device, machine, cli, window, ...) collide
# with unrelated crates on crates.io; nothing here is published there.
publish = false

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde-saphyr = { version = "=2.1.1", default-features = false, features = ["deserialize"] }
# Library error enums (§conventions: thiserror for stable library errors).
thiserror = "1"
# Frontend/test-only error plumbing.
anyhow = "1"
# SHA-256 for media image identity.
sha2 = "0.10"
winit = "0.30"
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
# `clipboard` gives egui-winit the host clipboard (arboard; smithay-clipboard on
# Wayland) instead of a string that lives only inside the app.
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "x11", "wayland"] }
cpal = "=0.18.2"
# CPU core: one device read and one device write for exchange and read-modify-write
# instructions on memory-mapped devices, and RAM/ROM lookups off the hot memory path.
# Every build and golden trace runs against a known CPU. A bare path dependency breaks
# nix build and CI. To develop against a local x86jit checkout, add a gitignored
# [patch] override instead of editing this line.
x86jit-core = { version = "0.3", git = "https://github.com/unemu-org/x86jit", rev = "cf32ec2ea7426da1cb90f8e96f67a1f45b73a8da" }
# The contract between front ends and emulator cores, at the commit of release
# v0.1.0. Every core and front end in one build must link the same copy, so the
# pin is an exact revision, moved together with every pinned core. A bare path
# dependency breaks nix build and CI. To develop against a local checkout of the
# contract, add a gitignored [patch] override instead of editing this line.
unemu-core-api = { version = "0.1", git = "https://github.com/unemu-org/unemu-core-api", rev = "4e2dd8325b54ce652bf4884fd85da602b14ae726" }

# Internal crates share the workspace version.
assembly = { path = "crates/assembly", version = "0.0.2" }
device = { path = "crates/device", version = "0.0.2" }
bus = { path = "crates/bus", version = "0.0.2" }
chipset = { path = "crates/chipset", version = "0.0.2" }
cpu = { path = "crates/cpu", version = "0.0.2" }
machine = { path = "crates/machine", version = "0.0.2" }
machine-file = { path = "crates/machine-file", version = "0.0.2" }
media = { path = "crates/media", version = "0.0.2" }
devices = { path = "crates/devices", version = "0.0.2" }
video = { path = "crates/video", version = "0.0.2" }
audio = { path = "crates/audio", version = "0.0.2" }
testkit = { path = "crates/testkit", version = "0.0.2" }
unemu-pc-core = { path = "crates/pc-core", version = "0.0.2" }
machine-view = { path = "crates/machine-view", version = "0.0.2" }

# Keep hardware preconditions and arithmetic checked even in optimized dev/test code.
[profile.dev]
debug-assertions = true
overflow-checks = true

# The CPU core and its decoder dominate instruction execution in dev/test builds.
[profile.dev.package."*"]
opt-level = 3

# Optimize the emulation loop while leaving frontends and test drivers unoptimized
# for debugging. The test profile inherits these optimization settings.
[profile.dev.package.devices]
opt-level = 3

[profile.dev.package.machine]
opt-level = 3

[profile.dev.package.bus]
opt-level = 3

[profile.dev.package.cpu]
opt-level = 3

[profile.dev.package.assembly]
opt-level = 3

[profile.dev.package.audio]
opt-level = 3

[profile.dev.package.chipset]
opt-level = 3

[profile.dev.package.media]
opt-level = 3
