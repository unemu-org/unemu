# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "2"
members = [
    "crates/device",
    "crates/bus",
    "crates/chipset",
    "crates/cpu",
    "crates/machine",
    "crates/devices",
    "crates/video",
    "crates/audio",
    "crates/assembly",
    "crates/testkit",
    "crates/cli",
    "crates/window",
    "crates/media",
    "crates/machine-file",
    "crates/image-store",
    "crates/registry",
    "crates/pc-image",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.99"
repository = "https://github.com/mikolajmikolajczyk/unemupc98"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde-saphyr = { version = "=2.1.1", default-features = false, features = ["deserialize"] }
# Library error enums (§conventions: thiserror for stable library errors).
thiserror = "1"
# Frontend/test-only error plumbing.
anyhow = "1"
# SHA-256 for media image identity.
sha2 = "0.10"
winit = "0.30"
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
cpal = "=0.18.2"
# CPU core: one dispatcher for real-mode and machine execution, and data accesses that
# span adjacent RAM and ROM regions.
# Every build and golden trace runs against a known CPU. A bare path dependency breaks
# nix build and CI. To develop against a local x86jit checkout, add a gitignored
# [patch] override instead of editing this line.
x86jit-core = { version = "0.3", git = "https://git.lab.mikolajczyk.org/unemu-org/x86jit", rev = "060d446a883a9b2fc94b3ef91258cb4e6e98d916" }

# Internal crates share the workspace version.
assembly = { path = "crates/assembly", version = "0.1.0" }
device = { path = "crates/device", version = "0.1.0" }
bus = { path = "crates/bus", version = "0.1.0" }
chipset = { path = "crates/chipset", version = "0.1.0" }
cpu = { path = "crates/cpu", version = "0.1.0" }
machine = { path = "crates/machine", version = "0.1.0" }
machine-file = { path = "crates/machine-file", version = "0.1.0" }
media = { path = "crates/media", version = "0.1.0" }
devices = { path = "crates/devices", version = "0.1.0" }
video = { path = "crates/video", version = "0.1.0" }
audio = { path = "crates/audio", version = "0.1.0" }
testkit = { path = "crates/testkit", version = "0.1.0" }

# Keep hardware preconditions and arithmetic checked even in optimized dev/test code.
[profile.dev]
debug-assertions = true
overflow-checks = true

# The CPU core and its decoder dominate instruction execution in dev/test builds.
[profile.dev.package."*"]
opt-level = 3

# Optimize the emulation loop while leaving frontends and test drivers unoptimized
# for debugging. The test profile inherits these optimization settings.
[profile.dev.package.devices]
opt-level = 3

[profile.dev.package.machine]
opt-level = 3

[profile.dev.package.bus]
opt-level = 3

[profile.dev.package.cpu]
opt-level = 3

[profile.dev.package.assembly]
opt-level = 3

[profile.dev.package.audio]
opt-level = 3

[profile.dev.package.chipset]
opt-level = 3

[profile.dev.package.media]
opt-level = 3
