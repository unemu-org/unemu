# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "2"
members = [
    "crates/device",
    "crates/bus",
    "crates/chipset",
    "crates/cpu",
    "crates/machine",
    "crates/devices",
    "crates/video",
    "crates/assembly",
    "crates/testkit",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.88"
repository = "https://github.com/mikolajmikolajczyk/unemupc98"

[workspace.dependencies]
# Library error enums (§conventions: thiserror for stable library errors).
thiserror = "1"
# Frontend/test-only error plumbing.
anyhow = "1"
# CPU core: pinned to an exact revision of x86jit main, so every build (and every
# golden trace) runs against a known CPU. Not a bare path dependency — that breaks
# nix build and CI. To develop against a local x86jit checkout, add a gitignored
# [patch] override instead of editing this line.
x86jit-core = { git = "https://git.lab.mikolajczyk.org/unemu-org/x86jit", rev = "f6f2720281432e9382702ba4b882381c21d578a1" }

# Internal crates share the workspace version.
assembly = { path = "crates/assembly" }
device = { path = "crates/device" }
bus = { path = "crates/bus" }
chipset = { path = "crates/chipset" }
cpu = { path = "crates/cpu" }
machine = { path = "crates/machine" }
devices = { path = "crates/devices" }
video = { path = "crates/video" }
testkit = { path = "crates/testkit" }

# Optimize dependencies (the CPU core and its decoder) even in dev/test builds,
# because emulator tests spend most of their time inside them. Workspace crates
# stay unoptimized with debug assertions and overflow checks.
[profile.dev.package."*"]
opt-level = 3
