# SPDX-License-Identifier: AGPL-3.0-or-later
# Open firmware only: the open AT BIOS (unemu-at-bios), the open VGA BIOS and
# XTIDE. Fetch them with vendor/unemu-at-bios/fetch.sh, vendor/vgabios/fetch.sh
# and vendor/xtide-universal-bios/fetch.sh.
# Create local media first; see machines/README.md, Playing DOS games.
schema = 1
extends = "preset:ibm-5170"
name = "at-games-open"
description = "Open-firmware 80286 AT with VGA, SB16/OPL3, COM1 mouse and journaled C:"

[board]
# The only display is the VGA card. The open AT BIOS reads this switch with the
# IBM polarity, so the colour position selects it, as for the IBM BIOS.
display_switch = "colour"

[board.rtc]
start = "2000-01-01T00:00:00"
nvram = "derived"

[cpu]
fpu = "none"

[memory]
conventional_kib = 640
# 1 MiB shortens the POST memory test; raise memory.extended_kib (0–15232 KiB, steps of 64) for more RAM.
extended_kib = 1024

[firmware.bios]
image = "../vendor/unemu-at-bios/bios-unemu-at.bin"
sha256 = "f8ecd4a2ad4906eb94a7595ede755019f545f40111725819eeb80e423adc8db6"
provides = ["floppy"]

# 32 KiB fills the C0000h-C7FFFh video-ROM window; XTIDE follows at C8000h.
[[firmware.option_roms]]
image = "../vendor/vgabios/vgabios-std.bin"
sha256 = "7570ef9c66fd386450bb35fd2b6c91aba6f8ec69a565a1d7747e6e6716ea5389"
base = 0xC0000

[[firmware.option_roms]]
image = "../vendor/xtide-universal-bios/ide_xtp-r638-ata1f0-8k.bin"
sha256 = "54975501e6887c836b8d57e7aad78421e745a9b71e250f94d5d1f9631eab1513"
base = 0xC8000
provides = ["fixed-disk"]

# The register-level VGA replaces the preset's MDA and text-only VGA cards.
[[card]]
id = "mda"
remove = true

[[card]]
id = "vga-text"
remove = true

[[card]]
kind = "vga"

[[card]]
kind = "sb16"
base = 0x220
irq = 5
dma8 = 1
dma16 = 5

[[card]]
id = "uart-16550"
port = 0x3F8
irq = 4
mouse = "microsoft"

[[card]]
kind = "ide"
# XTIDE uses ATA task-file semantics rather than the IBM adapter's latches.
controller_model = "ata"
port = 0x1F0
irq = 14

[[card.drives]]
channel = "master"
image = "local/games.img"
geometry = { cylinders = 615, heads = 4, sectors = 17 }
write = "journal"
journal = "local/games.upfj"
keep_generations = 10

[[card]]
id = "fdc-765"

[[card.drives]]
unit = 0
type = "1.2M"

[[card.drives.media]]
image = "../vendor/freedos/freedos-1200.img"
sha256 = "4ee55e9c44d553041b9bbde99cacae31472f12debf6c9b9c09c5b9343c435d7e"
write = "readonly"

[[card.drives.media]]
image = "../vendor/freedos/freedos-tools-1200.img"
sha256 = "8d91283a1c0d6fc5b5fdb5e40db5b66dd9fabbf014d37262b7892f3b150b6f63"
write = "readonly"

[[card.drives.media]]
image = "local/transfer-1200.img"
write = "readonly"

# B: is a 3.5-inch 1.44M drive, empty at power-on; it also takes 720K disks.
# Insert images with Media > Insert, or list them in a local child profile.
[[card.drives]]
unit = 1
type = "1.44M"
empty = true

# Lo-tech 2 MiB EMS board in the ISA expansion-memory window.
[[card]]
kind = "lotech-ems"
port = 0x260
frame = 0xD000
size_kib = 2048
