# SPDX-License-Identifier: AGPL-3.0-or-later
schema = 1
extends = "at-freedos.toml"
# The inherited IBM AT CPU rate is 8/13 steps per PIT clock.
name = "at-ide"
description = "PC/AT with XTIDE Universal BIOS, booting FreeDOS from A: with a readonly FAT16 C:"

[firmware.bios]
image = "../vendor/kiselev-bios/bios-xi8088-atreset.bin"
sha256 = "61589573c9809273198b137d9419c87242b0a5f63c2ad834a9565950c3d6becc"

[[firmware.option_roms]]
image = "../vendor/xtide-universal-bios/ide_xtp-r638-ata1f0-8k.bin"
sha256 = "54975501e6887c836b8d57e7aad78421e745a9b71e250f94d5d1f9631eab1513"
base = 0xC8000
provides = ["fixed-disk"]

[[card]]
kind = "ide"
port = 0x1F0
irq = 14

[[card.drives]]
channel = "master"
image = "../vendor/hdd/fat16.img"
sha256 = "e97f1eb42c1dcef1a2fbf9541135b22a955704836088c46bd280d27780e9ba2d"
geometry = { cylinders = 615, heads = 4, sectors = 17 }
# A directory listing must succeed without accepting any guest disk writes.
write = "readonly"
