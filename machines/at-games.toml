# SPDX-License-Identifier: AGPL-3.0-or-later
# Supply the pinned system/video ROMs; see vendor/user-roms/README.md.
# Create local media first; see machines/README.md, Playing DOS games.
schema = 1
extends = "preset:ibm-5170"
name = "at-games"
description = "80286 AT with IBM system/VGA firmware, SB16/OPL3, COM1 mouse and journaled C:"

[board]
display_switch = "auto"

[board.rtc]
start = "2000-01-01T00:00:00"
nvram = "derived"

[cpu]
fpu = "none"

[memory]
conventional_kib = 640
# The board permits 15232 KiB extended; 4 MiB leaves room below its ROM alias.
# IBM Personal Computer AT Technical Reference, System Board, System Memory Map.
extended_kib = 4096

[firmware.bios]
sha256 = "6fb653b58e678cb69b0f943a105c6c803b18a6db23d13c0abccec5b66c6ee652"
provides = ["floppy", "fixed-disk"]

[[firmware.bios.parts]]
image = "../vendor/user-roms/ibm-5170-bios-1985-06-10/6480090.u27"
lane = "even"
sha256 = "c8654ed7a922644db2b2cce54c540fcfa7cbbae8c514d7eb3dbfbb8187471bfd"

[[firmware.bios.parts]]
image = "../vendor/user-roms/ibm-5170-bios-1985-06-10/6480091.u47"
lane = "odd"
sha256 = "470ab30f9eb7d56c24f5ce10c7d307c539b9f923ea97dd536d2d5ba7e36d471b"

[[firmware.option_roms]]
image = "../vendor/user-roms/ibm-vga-bios-1987-32k/ibm-vga-1987-32k.bin"
sha256 = "51b49761f72780a696c36f3d2e74a8168c1c99b865070f7f90b8e621a8b5ae17"
base = 0xC0000
# Keep the complete EPROM pinned; only its measured option-ROM suffix is mapped.
offset = 0x2000

[[card]]
id = "mda"
remove = true

[[card]]
id = "vga-text"
remove = true

[[card]]
kind = "vga"

[[card]]
kind = "sb16"
base = 0x220
irq = 5
dma8 = 1
dma16 = 5
# The SB16 always includes OPL3; no separate FM card is needed.

[[card]]
id = "uart-16550"
port = 0x3F8
irq = 4
mouse = "microsoft"

[[card]]
kind = "ide"
controller_model = "at-adapter"
port = 0x1F0
irq = 14

[[card.drives]]
channel = "master"
image = "local/games.img"
# Derived IBM CMOS requires a listed disk type: 615/4/17 is type 2.
# IBM Personal Computer AT Technical Reference, Fixed Disk BIOS, Drive Parameters.
geometry = { cylinders = 615, heads = 4, sectors = 17 }
write = "journal"
journal = "local/games.upfj"
keep_generations = 10

[[card]]
id = "fdc-765"

[[card.drives]]
unit = 0
type = "1.2M"
# The June 1985 BIOS has no 1.44M type. B: is deliberately absent.
# IBM Personal Computer AT Technical Reference, Diskette BIOS, Drive Types.

[[card.drives.media]]
image = "../vendor/freedos/freedos-1200.img"
sha256 = "4ee55e9c44d553041b9bbde99cacae31472f12debf6c9b9c09c5b9343c435d7e"
write = "readonly"

[[card.drives.media]]
image = "local/transfer-1200.img"
write = "readonly"
# Add user-supplied 1.2M installation/game floppies in a local child profile.
