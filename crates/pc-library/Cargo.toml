# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "pc-library"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "The desktop's PC library without a toolkit: its worker thread, the machines, firmware and installation media collections, the snapshot the frame lists, the image details, Settings on an image, its firmware choices, the New machine wizard, a machine file's settings, the machine-file list and the PC's part of the registry models (core-contract.md §8.1)."

[package.metadata.unemu]
layer = "pc"

[features]
# This crate's source folder, for the desktop's test that checks every drawn
# string's glyphs, the private labels and helpers the desktop's tests of
# these collections compare with, and the library's fixtures: synthetic
# stores, firmware and catalogue, test workers, machine rows read at once and
# the hang guard.
test-support = ["assembly/test-support", "pc-image/test-support"]

[dependencies]
assembly.workspace = true
image-store = { path = "../image-store", version = "0.0.2" }
image-registry = { path = "../registry", version = "0.0.2" }
# The image listing and the save form the PC models build on.
library-model = { path = "../library-model", version = "0.0.2" }
machine-file.workspace = true
media.workspace = true
# The media models a machine's row and the installation sets name.
pc-media = { path = "../pc-media", version = "0.0.2" }
pc-image = { path = "../pc-image", version = "0.0.2" }
serde.workspace = true
toml.workspace = true
# The platform as the PC core describes it, for the registry models.
unemu-core-api.workspace = true
unemu-pc-core.workspace = true

[dev-dependencies]
assembly = { workspace = true, features = ["test-support"] }
image-store = { path = "../image-store", version = "0.0.2", features = ["test-support"] }
image-registry = { path = "../registry", version = "0.0.2", features = ["test-support"] }
library-model = { path = "../library-model", version = "0.0.2", features = ["test-support"] }
pc-image = { path = "../pc-image", version = "0.0.2", features = ["test-support"] }
sha2.workspace = true
