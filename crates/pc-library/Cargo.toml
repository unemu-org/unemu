# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "pc-library"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "The desktop's PC library models, without a toolkit: the machines, firmware and installation media collections, the snapshot the frame lists, the image details, Settings on an image and its firmware choices (core-contract.md §8.1)."

[package.metadata.unemu]
layer = "pc"

[features]
# This crate's source folder, for the desktop's test that checks every drawn
# string's glyphs, and the private labels and helpers the desktop's tests of
# these collections compare with.
test-support = []

[dependencies]
assembly.workspace = true
image-store = { path = "../image-store", version = "0.0.2" }
image-registry = { path = "../registry", version = "0.0.2" }
# The image listing and the save form the PC models build on.
library-model = { path = "../library-model", version = "0.0.2" }
machine-file.workspace = true
# The media models a machine's row and the installation sets name.
pc-media = { path = "../pc-media", version = "0.0.2" }
pc-image = { path = "../pc-image", version = "0.0.2" }
toml.workspace = true
