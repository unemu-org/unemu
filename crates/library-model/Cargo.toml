# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "library-model"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "The desktop library's platform-neutral models, without a toolkit: registry accounts, the image listing and the save form (core-contract §8.1)."

[package.metadata.unemu]
layer = "neutral"

[dependencies]
image-store = { path = "../image-store", version = "0.0.2" }
image-registry = { path = "../registry", version = "0.0.2" }
toml.workspace = true

[dev-dependencies]
image-store = { path = "../image-store", version = "0.0.2", features = ["test-support"] }
image-registry = { path = "../registry", version = "0.0.2", features = ["test-support"] }

[features]
# Waits for a page's background jobs, for the tests of the views built on
# these models.
test-support = []
