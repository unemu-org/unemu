[package]
name = "library-model"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "The desktop library's platform-neutral models, without a toolkit: registry accounts, push and pull, Remotes, the image listing and the save form (core-contract §8.1)."

[package.metadata.unemu]
layer = "neutral"

[dependencies]
image-store = { path = "../image-store", version = "0.0.3" }
image-registry = { path = "../registry", version = "0.0.3" }
# The platform descriptions the provider seam hands in.
unemu-core-api.workspace = true
toml.workspace = true

[dev-dependencies]
image-store = { path = "../image-store", version = "0.0.3", features = ["test-support"] }
image-registry = { path = "../registry", version = "0.0.3", features = ["test-support"] }

[features]
# Waits for a page's background jobs, and the texts and helpers the tests
# of the views built on these models compare with.
test-support = []
