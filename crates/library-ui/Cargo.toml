# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "library-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "The desktop library's platform-neutral views, drawn with egui: the list tables, the save form, the push and pull dialogs and Remotes (core-contract §8.1)."

[package.metadata.unemu]
layer = "neutral"

[features]
# This crate's source folder, for the desktop's test that checks every drawn
# string's glyphs, and the layout figures, labels and helpers the desktop's
# tests of these views, which drive the whole library frame, compare with.
test-support = []

[dependencies]
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
image-registry = { path = "../registry", version = "0.0.3" }
image-store = { path = "../image-store", version = "0.0.3" }
# The models these views draw.
library-model = { path = "../library-model", version = "0.0.3" }
# The desktop's skin, icons and panes.
ui-kit = { path = "../ui-kit", version = "0.0.3" }
