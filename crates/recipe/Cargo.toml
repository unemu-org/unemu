# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "recipe"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Platform-neutral recipes: the typed model, the TOML 1.0 parser, the static checks of recipes.md §6, libraries and their index, and the plan."

[package.metadata.unemu]
layer = "neutral"

[dependencies]
unemu-core-api.workspace = true
image-store = { path = "../image-store", version = "0.0.5" }
# The deflate decoder of zip members in a library, the version the lock
# already holds.
miniz_oxide = "0.9.1"
serde.workspace = true
serde_json = "1.0.154"
sha2.workspace = true
toml.workspace = true
# The parser inside `toml`, at the version the lock already pins: its event
# stream is where the TOML 1.1 forms that `toml` accepts are refused.
toml_parser = "1.1.5"

# Whether the process that left a staging folder still runs.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
