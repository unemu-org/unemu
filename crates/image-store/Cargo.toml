# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "image-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Platform-neutral content-addressed machine image store in OCI Image Layout."

[package.metadata.unemu]
layer = "neutral"

[dependencies]
serde.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value"] }
toml.workspace = true
sha2.workspace = true
thiserror.workspace = true
# These exact pins are part of Zstandard encoder profile 1 (the codec module
# documentation, machine-images §2, tests/zstd_profile.rs). Stored frames are
# reproducible only for one libzstd release, so a version that writes other
# bytes is a new profile beside profile 1, never an update of these pins.
zstd = { version = "=0.13.5", default-features = false }
zstd-safe = { version = "=7.4.1", default-features = false }
# 2.1.3 bundles libzstd 1.5.7; Cargo ignores the +zstd.1.5.7 build metadata.
zstd-sys = { version = "=2.1.3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
test-support = []
