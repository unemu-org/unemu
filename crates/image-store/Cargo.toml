# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "image-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Platform-neutral content-addressed machine image store in OCI Image Layout."

[dependencies]
serde.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value"] }
toml.workspace = true
sha2.workspace = true
thiserror.workspace = true
# The whole codec stack is pinned exactly: stored frames are deterministic only
# for one libzstd release, so an update must be deliberate (commands.md).
zstd = { version = "=0.13.5", default-features = false }
zstd-safe = { version = "=7.4.1", default-features = false }
# 2.1.3 bundles libzstd 1.5.7; Cargo ignores the +zstd.1.5.7 build metadata.
zstd-sys = { version = "=2.1.3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
test-support = []
