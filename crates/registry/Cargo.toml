[package]
name = "image-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Platform-neutral OCI distribution client: push and pull of machine images."

[package.metadata.unemu]
layer = "neutral"

[dependencies]
image-store = { path = "../image-store", version = "0.0.2" }
serde.workspace = true
serde_json = "1.0.154"
toml.workspace = true
thiserror.workspace = true
# Small blocking HTTP client. Default features are off: they bundle the
# webpki-roots certificate list, whose licence is outside the allow list.
ureq = { version = "3.5.2", default-features = false, features = ["rustls-no-provider"] }
# TLS without the default aws-lc provider (its OpenSSL-licensed C sources are
# outside the licence allow list); ring supplies the cryptography.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Server certificates verify against the operating system's trust store.
rustls-native-certs = "0.8.5"

[dev-dependencies]
# Tags an image as a newer release would, in a store both share.
image-store = { path = "../image-store", version = "0.0.2", features = ["test-support"] }

[features]
test-support = []
