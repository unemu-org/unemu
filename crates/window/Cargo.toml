# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "window"
version.workspace = true
edition.workspace = true
# The fonts come with ui-kit and the PC core, which carry their licences.
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "The desktop: the shell, the machine library and the window of a running machine (§9)."

[package.metadata.unemu]
layer = "application"

[dependencies]
image-store = { path = "../image-store", version = "0.0.2" }
image-registry = { path = "../registry", version = "0.0.2" }
pc-image = { path = "../pc-image", version = "0.0.2" }
# The platforms compiled in: their image providers and the licence notice.
platforms = { path = "../platforms", version = "0.0.2" }
media.workspace = true
sha2.workspace = true
serde.workspace = true
toml.workspace = true
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
eframe.workspace = true
devices.workspace = true
machine-file.workspace = true
assembly.workspace = true
winit.workspace = true
# The PC media and library models below the desktop's views.
pc-media = { path = "../pc-media", version = "0.0.2" }
pc-library = { path = "../pc-library", version = "0.0.2" }
# The desktop's skin, icons, panes, file dialogs and clipboard shortcuts.
ui-kit = { path = "../ui-kit", version = "0.0.2" }
# The library's platform-neutral models: registry accounts, the image
# listing and the save form.
library-model = { path = "../library-model", version = "0.0.2" }
# The library's platform-neutral views: the list tables, the save form and
# the push and pull dialogs.
library-ui = { path = "../library-ui", version = "0.0.2" }
# The PC media views: the media picker, Create from files… and the Catalogue
# submenu.
media-ui = { path = "../media-ui", version = "0.0.2" }
# The contract the machine window drives, the session over it, and the PC
# behind it.
unemu-core-api.workspace = true
machine-view.workspace = true
unemu-pc-core.workspace = true

# The native application menu and the system quit hook, at the versions
# eframe, rfd and arboard already lock, so no new crate enters the build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDate", "NSObjCRuntime", "NSObject", "NSRunLoop", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSWindow"] }

[dev-dependencies]
audio.workspace = true
device.workspace = true
machine.workspace = true
video.workspace = true
image-store = { path = "../image-store", version = "0.0.2", features = ["test-support"] }
image-registry = { path = "../registry", version = "0.0.2", features = ["test-support"] }
media = { workspace = true, features = ["test-support"] }
pc-image = { path = "../pc-image", version = "0.0.2", features = ["test-support"] }
assembly = { workspace = true, features = ["test-support"] }
cpu.workspace = true
ui-kit = { path = "../ui-kit", version = "0.0.2", features = ["test-support"] }
library-model = { path = "../library-model", version = "0.0.2", features = ["test-support"] }
library-ui = { path = "../library-ui", version = "0.0.2", features = ["test-support"] }
media-ui = { path = "../media-ui", version = "0.0.2", features = ["test-support"] }
pc-media = { path = "../pc-media", version = "0.0.2", features = ["test-support"] }
pc-library = { path = "../pc-library", version = "0.0.2", features = ["test-support"] }
machine-view = { workspace = true, features = ["test-support"] }
unemu-pc-core = { workspace = true, features = ["test-support"] }

[[bin]]
name = "unemupc"
path = "src/main.rs"
