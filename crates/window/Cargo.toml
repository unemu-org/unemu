# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "window"
version.workspace = true
edition.workspace = true
# The binary embeds CC BY-SA fonts, CC0 logo data and a Bitstream Vera licensed
# DejaVu Sans symbol subset alongside the AGPL source.
license = "AGPL-3.0-or-later AND CC-BY-SA-4.0 AND CC0-1.0 AND Bitstream-Vera"
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Windowed presenter: draws text frames in a host window (§9)."

[dependencies]
image-store = { path = "../image-store", version = "0.1.0" }
image-registry = { path = "../registry", version = "0.1.0" }
pc-image = { path = "../pc-image", version = "0.1.0" }
image = { version = "=0.25.10", default-features = false, features = ["png", "gif"] }
cli = { path = "../cli", version = "0.1.0" }
media.workspace = true
sha2.workspace = true
rfd = { version = "=0.18.0", default-features = false, features = ["xdg-portal"] }
serde.workspace = true
toml.workspace = true
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
eframe.workspace = true
audio.workspace = true
device.workspace = true
devices.workspace = true
cpal.workspace = true
machine-file.workspace = true
video.workspace = true
assembly.workspace = true
machine.workspace = true
winit.workspace = true

# The native application menu, the system quit hook and the opt-in keyboard
# tap for system shortcuts, at the versions eframe, rfd and arboard already
# lock, so no new crate enters the build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDate", "NSObjCRuntime", "NSObject", "NSRunLoop", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSWindow"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }

# Synthetic key events for the keyboard tap's decoding tests.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGRemoteOperation"] }

[dev-dependencies]
image-store = { path = "../image-store", version = "0.1.0", features = ["test-support"] }
image-registry = { path = "../registry", version = "0.1.0", features = ["test-support"] }
media = { workspace = true, features = ["test-support"] }
pc-image = { path = "../pc-image", version = "0.1.0", features = ["test-support"] }
assembly = { workspace = true, features = ["test-support"] }
cpu.workspace = true

[[bin]]
name = "unemupc"
path = "src/main.rs"
