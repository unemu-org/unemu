[package]
name = "window"
version.workspace = true
edition.workspace = true
# The binary embeds CC BY-SA font data alongside the AGPL source code.
license = "AGPL-3.0-or-later AND CC-BY-SA-4.0"
rust-version.workspace = true
repository.workspace = true
description = "Windowed presenter: draws text frames in a host window (§9)."

[dependencies]
rfd = { version = "=0.18.0", default-features = false, features = ["xdg-portal"] }
serde.workspace = true
toml.workspace = true
egui.workspace = true
eframe.workspace = true
audio.workspace = true
device.workspace = true
cpal.workspace = true
machine-file.workspace = true
video.workspace = true
assembly.workspace = true
machine.workspace = true
winit.workspace = true

[dev-dependencies]
sha2.workspace = true
assembly = { workspace = true, features = ["test-support"] }
cpu.workspace = true

[[bin]]
name = "unemupc98-window"
path = "src/main.rs"
