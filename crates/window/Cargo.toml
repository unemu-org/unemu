# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "window"
version.workspace = true
edition.workspace = true
# The crate embeds CC BY-SA fonts alongside the AGPL source; the logo and the
# symbol font come with ui-kit.
license = "AGPL-3.0-or-later AND CC-BY-SA-4.0"
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Windowed presenter: draws text frames in a host window (§9)."

[package.metadata.unemu]
layer = "application"

[dependencies]
image-store = { path = "../image-store", version = "0.0.2" }
image-registry = { path = "../registry", version = "0.0.2" }
pc-image = { path = "../pc-image", version = "0.0.2" }
# The platforms compiled in: their image providers and the licence notice.
platforms = { path = "../platforms", version = "0.0.2" }
media.workspace = true
sha2.workspace = true
serde.workspace = true
toml.workspace = true
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
eframe.workspace = true
audio.workspace = true
device.workspace = true
devices.workspace = true
cpal.workspace = true
machine-file.workspace = true
video.workspace = true
assembly.workspace = true
machine.workspace = true
winit.workspace = true
# The desktop's skin, icons, panes, file dialogs and clipboard shortcuts.
ui-kit = { path = "../ui-kit", version = "0.0.2" }

# The native application menu, the system quit hook and the opt-in keyboard
# tap for system shortcuts, at the versions eframe, rfd and arboard already
# lock, so no new crate enters the build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDate", "NSObjCRuntime", "NSObject", "NSRunLoop", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSWindow"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }

# Synthetic key events for the keyboard tap's decoding tests.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGRemoteOperation"] }

[dev-dependencies]
image-store = { path = "../image-store", version = "0.0.2", features = ["test-support"] }
image-registry = { path = "../registry", version = "0.0.2", features = ["test-support"] }
media = { workspace = true, features = ["test-support"] }
pc-image = { path = "../pc-image", version = "0.0.2", features = ["test-support"] }
assembly = { workspace = true, features = ["test-support"] }
cpu.workspace = true
ui-kit = { path = "../ui-kit", version = "0.0.2", features = ["test-support"] }

[[bin]]
name = "unemupc"
path = "src/main.rs"
