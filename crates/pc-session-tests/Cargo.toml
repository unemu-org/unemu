# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "pc-session-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Tests of the desktop's session of one PC: machine-view's Session driving the PC core (core-contract.md §8.1.10). No library code."

[package.metadata.unemu]
layer = "pc"

[lib]
doctest = false

# Everything is for the tests: a change to the session, the PC core or the
# emulation below it runs them, a change to the desktop does not.
[dev-dependencies]
pc-harness = { path = "../pc-harness", version = "0.0.3", features = ["test-support"] }
core-launch = { path = "../core-launch", version = "0.0.3" }
toml.workspace = true
assembly = { workspace = true, features = ["test-support"] }
audio.workspace = true
cpu.workspace = true
device.workspace = true
machine.workspace = true
machine-file = { workspace = true, features = ["test-support"] }
pc-config.workspace = true
media.workspace = true
video.workspace = true
# The session, with its full-slice advances and host-audio probes.
machine-view = { workspace = true, features = ["test-support"] }
unemu-core-api = { workspace = true, features = ["test-support"] }
unemu-pc-core = { workspace = true, features = ["test-support"] }
winit.workspace = true
# The open games template image, built and started as the library starts it.
image-store = { path = "../image-store", version = "0.0.3" }
pc-image = { path = "../pc-image", version = "0.0.3", features = ["test-support"] }
pc-library = { path = "../pc-library", version = "0.0.3" }

journal-files.workspace = true
