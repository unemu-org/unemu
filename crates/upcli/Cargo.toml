# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "upcli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Command composition library for the unemu frontend for deterministic Real16 PC/AT machines and their images (§3.1): the neutral command line with the platforms compiled in."

[package.metadata.unemu]
layer = "application"

[dependencies]
machine-file.workspace = true
cli-core = { path = "../cli-core", version = "0.0.3" }
cli-pc = { path = "../cli-pc", version = "0.0.3" }
# The platforms compiled in: their cores and the licence notice.
platforms = { path = "../platforms", version = "0.0.3" }
# The cores this program can drive, and their About lines.
core-launch = { path = "../core-launch", version = "0.0.3" }
# The host's default store and firmware index, which the executable supplies.
image-store = { path = "../image-store", version = "0.0.3" }
assembly.workspace = true
# The third-party notice of `--version` and `--about`.
devices.workspace = true

[dev-dependencies]
pc-harness = { workspace = true, features = ["test-support"] }
pc-image = { path = "../pc-image", version = "0.0.3" }
image-registry = { path = "../registry", version = "0.0.3", features = ["test-support"] }
cpu.workspace = true
machine.workspace = true
