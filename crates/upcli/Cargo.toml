# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "upcli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Command-line frontend for deterministic Real16 PC/AT machines and their images (§3.1): the neutral command line with the platforms compiled in."

[package.metadata.unemu]
layer = "application"

[[bin]]
name = "upcli"
path = "src/main.rs"

[dependencies]
cli-core = { path = "../cli-core", version = "0.0.2" }
cli-pc = { path = "../cli-pc", version = "0.0.2" }
# The platforms compiled in: the licence notice.
platforms = { path = "../platforms", version = "0.0.2" }
# The host's default store and firmware index, which the executable supplies.
image-store = { path = "../image-store", version = "0.0.2" }
assembly.workspace = true
# The third-party notice of `--version` and `--about`.
devices.workspace = true

[dev-dependencies]
pc-harness = { path = "../pc-harness", version = "0.0.2" }
pc-image = { path = "../pc-image", version = "0.0.2" }
image-registry = { path = "../registry", version = "0.0.2", features = ["test-support"] }
cpu.workspace = true
machine.workspace = true
