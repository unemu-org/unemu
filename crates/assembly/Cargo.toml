[package]
name = "assembly"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Declarative machine-configuration data model, validation, and the assembler that turns it into a running Machine (§3.1)."

[dependencies]
thiserror.workspace = true
media = { path = "../media", version = "0.1.0" }
# The seams whose types the configuration names. The config is declarative data
# about these crates' hardware; the assembler (a later task) turns it into the
# concrete Bus/DecodeMap/IrqLine/Machine those crates define.
machine.workspace = true
cpu.workspace = true
bus.workspace = true
device.workspace = true
devices.workspace = true
video.workspace = true
# The one shared 8259 interrupt controller: a live master/slave pair presented
# both as two bus device faces and as the machine's single controller seam.
chipset.workspace = true

[features]
default = []
test-support = ["media/test-support"]
reference-scheduler = ["machine/reference-scheduler"]

[dev-dependencies]
media = { path = "../media", version = "0.1.0", features = ["test-support"] }
