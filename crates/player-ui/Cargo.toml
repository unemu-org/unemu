# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "player-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "The view of one machine started from a file, driven through the core contract alone: the screen, the Machine, Media and View menus, the status line, the Input dialog and the player's message boxes (core-contract.md §13.3)."

[package.metadata.unemu]
layer = "neutral"

[dependencies]
unemu-core-api.workspace = true
# The session the player drives, the screen's geometry and the pad table.
machine-view.workspace = true
# The prepared file a player starts from, and starts again on a power cycle.
core-launch = { path = "../core-launch", version = "0.0.4" }
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
# The desktop's skin, marks and dialog title strips.
ui-kit = { path = "../ui-kit", version = "0.0.4" }
# The host's key, button and window types the session takes, at the version
# machine-view already uses.
winit.workspace = true

[dev-dependencies]
# Full-slice advances, so a test sees the machine an infinitely fast host
# would.
machine-view = { workspace = true, features = ["test-support"] }
# The whole core the player's tests run, through the contract alone.
unemu-test-core = { path = "../test-core", version = "0.0.4" }
ui-kit = { path = "../ui-kit", version = "0.0.4", features = ["test-support"] }
