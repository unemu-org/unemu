# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "pc-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "The desktop's PC dialogs, drawn with egui: Settings… of a machine file and of an image with its review, File › New machine…, the disk-layer dialog, the PC parts of the details panes and the desktop's command vocabulary (core-contract.md §8.1)."

[package.metadata.unemu]
layer = "pc"

[features]
# This crate's source folder, for the desktop's test that checks every drawn
# string's glyphs, and the disk-layer dialog's helpers that the desktop's
# tests of the library frame drive it with.
test-support = []

[dependencies]
assembly.workspace = true
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
image-registry = { path = "../registry", version = "0.0.2" }
image-store = { path = "../image-store", version = "0.0.2" }
# The image listing and the save form's model and view.
library-model = { path = "../library-model", version = "0.0.2" }
library-ui = { path = "../library-ui", version = "0.0.2" }
pc-image = { path = "../pc-image", version = "0.0.2" }
# The speed a command carries.
machine-view.workspace = true
# The PC library and media models these dialogs draw.
pc-library = { path = "../pc-library", version = "0.0.2" }
pc-media = { path = "../pc-media", version = "0.0.2" }
# The desktop's skin, icons and pane layout.
ui-kit = { path = "../ui-kit", version = "0.0.2" }

[dev-dependencies]
assembly = { workspace = true, features = ["test-support"] }
pc-image = { path = "../pc-image", version = "0.0.2", features = ["test-support"] }
pc-library = { path = "../pc-library", version = "0.0.2", features = ["test-support"] }
toml.workspace = true
ui-kit = { path = "../ui-kit", version = "0.0.2", features = ["test-support"] }
