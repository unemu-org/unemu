# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "platforms"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "The emulator platforms compiled into both programs: their cores, their image providers and the licence notice."

[package.metadata.unemu]
layer = "application"

[dependencies]
assembly.workspace = true
image-registry = { path = "../registry", version = "0.0.3" }
image-store = { path = "../image-store", version = "0.0.3" }
pc-image = { path = "../pc-image", version = "0.0.3" }
# The cores compiled in.
unemu-core-api.workspace = true
unemu-pc-core.workspace = true
unemu-nes-core.workspace = true
# The scripted core, only for trying the front end's generic path by hand;
# see the `test-core` feature.
unemu-test-core = { path = "../test-core", version = "0.0.3", optional = true }

[features]
# Adds the scripted test core to the list of compiled-in cores. Off by
# default and never set by a release build: the test core emulates nothing.
# With it on, the pinned --about texts of upcli and the desktop gain a line
# and their pin tests fail; the gates never test with it.
test-core = ["dep:unemu-test-core"]

[dev-dependencies]
# The check the programs make of every core, run over the list.
core-launch = { path = "../core-launch", version = "0.0.3" }
# A scratch directory for the cartridge file the NES test opens.
image-store = { path = "../image-store", version = "0.0.3", features = ["test-support"] }
