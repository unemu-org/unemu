# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "pc-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Machine runners, guest programs and the emulation golden tests for deterministic Real16 PC/AT machines (§3.1)."

[package.metadata.unemu]
layer = "pc"
side = "core"

[dependencies]
anyhow.workspace = true
assembly.workspace = true
cpu.workspace = true
device.workspace = true
chipset.workspace = true
machine.workspace = true
devices.workspace = true
video.workspace = true

[dev-dependencies]
bus.workspace = true
testkit.workspace = true
toml.workspace = true
# The goldens that boot a shipped machine file load it the way the command
# line does.
machine-file.workspace = true
# The FAT12 reader that checks disks the guest wrote.
media = { workspace = true, features = ["test-support"] }
machine = { workspace = true, features = ["reference-scheduler"] }
assembly = { workspace = true, features = ["reference-scheduler", "test-support"] }
