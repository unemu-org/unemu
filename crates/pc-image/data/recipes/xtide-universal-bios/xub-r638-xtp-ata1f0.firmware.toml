# The XTIDE Universal BIOS r638 XT+ build for 16-bit ATA at 1F0h, the
# fixed-disk option ROM of unemupc's open AT templates: the firmware package
# unemu/firmware/ibm-pc/xub-r638-xtp-ata1f0:r1. The ROM (configured, padded
# and checksummed by the fork's release workflow) and its source archive
# (the r638 Subversion trunk) are release assets of
# github.com/unemu-org/xtide-universal-bios r638-unemu.1, taken unmodified
# (no step); both equal what unemupc's firmware catalogue pins for this id.
# The title, description, vendor, version and labels are unemupc's
# (pc_image::template::FIRMWARE), word for word. digest and the lock beside
# this file pin the package (docs/recipes.md).

recipe = "1.0"

[firmware]
name = "unemu/firmware/ibm-pc/xub-r638-xtp-ata1f0"
platform = "ibm-pc"
revision = 1
digest = "sha256:4dc25f1c00342e44b2476e84befc9dbbb1817d478cdda9b1fd0a5d8e026026a1"

[package]
title = "XTIDE Universal BIOS r638, XT+ build for ATA at 1F0h"
vendor = "XTIDE Universal BIOS project"
version = "r638"
# The date: the ROM's own version string, "r638 (2026-06-09)".
date = "2026-06-09"
labels = ["ata", "open-source", "option-rom", "pc-at"]
description = "The fixed-disk option ROM of the open AT templates: the XTIDE Universal BIOS r638 XT+ build (ide_xtp.bin) with its first controller set to 16-bit ATA at 1F0h (control block 3F0h), polled without an IRQ, and diskette A: as the boot drive; every other setting keeps its upstream default. The download is padded with zeros to its declared 8 KiB and its last byte makes the byte sum zero. It serves IBM 5170-class boards with a primary ATA channel, suggested at C8000h, on an 80186 or later. Licensed under GPL-2.0-only, as the project's binary download statement says; the package includes its corresponding source archive, the r638 Subversion trunk."

# What the catalogue records for the ROM, stated as it is.
[package.fits]
boards = ["ibm-5170"]
machine_classes = ["at"]

[license]
expression = "GPL-2.0-only"
source = "source"

[input.rom]
name = "ide_xtp-r638-ata1f0-8k.bin"
size = 8192
sha256 = "54975501e6887c836b8d57e7aad78421e745a9b71e250f94d5d1f9631eab1513"
urls = [
    "https://github.com/unemu-org/xtide-universal-bios/releases/download/r638-unemu.1/ide_xtp-r638-ata1f0-8k.bin",
]

[input.source]
name = "xtide-universal-bios-r638-src.tar"
size = 2201600
sha256 = "7bbd5de269f4e1d52ae30b52531fcda842709b9ae49166ac249f9b37187b91e8"
urls = [
    "https://github.com/unemu-org/xtide-universal-bios/releases/download/r638-unemu.1/xtide-universal-bios-r638-src.tar",
]

[[rom]]
id = "option-rom"
role = "option-rom"
catalogue_id = "xub-r638-xtp-ata1f0"
from = "rom"

[[extra]]
id = "source"
file_name = "xtide-universal-bios-r638-src.tar"
kind = "archive"
from = "source"
