# The FreeDOS 1.4 Floppy Edition, released by the FreeDOS Project on
# 2025-04-02, on its 3.5-inch 1.44M disks: the media set
# unemu/media/ibm-pc/freedos:1.4-r1 (alias 1.4). The disks are the
# edition's images, unmodified, in installer order, taken from the edition's
# zip by their pins; LICENSES.TXT is our licence index (licenses.txt,
# CC0-1.0) with DOS line ends; the source archive is a prepared input that
# source/build.sh rebuilds. What every FreeDOS release shares is in
# freedos.work.toml. digest and the lock beside this file pin the set, as
# the release of upcli.toml pinned it (docs/recipes.md).

recipe = "1.0"
work = "freedos"

[media]
name = "unemu/media/ibm-pc/freedos"
platform = "ibm-pc"
release = "1.4"
revision = 1
digest = "sha256:77060710c8e05136896a9e84ebee82035b1212114f9e288630dfabe730a5b754"

[title]
version = "1.4"
edition = "Floppy Edition"
# readme.txt of FD14-FloppyEdition.zip, section "FreeDOS Floppy-Only
# Edition (FD14-x86)": its sentence on what the edition runs on, word for
# word, with its line break as a space and its closing colon left out.
requirements = "This edition should run on any hardware that can run FreeDOS and has EGA or better graphics"
year = 2025
description = "The official FreeDOS 1.4 Floppy Edition on seven 3.5-inch 1.44M diskettes, unmodified: the boot disk with the floppy installer, then six disks of packages in a Slicer archive. It installs FreeDOS 1.4 with a set of programs suited to classic PCs, the 80286 included, on any PC that runs FreeDOS with EGA or better graphics. Released by the FreeDOS Project on 2 April 2025. GPL and other open source licences, listed per program in LICENSES.TXT; the set carries the official FreeDOS source packages of its programs."

[license]
expression = "GPL-1.0-only AND GPL-1.0-or-later AND GPL-2.0-only AND GPL-2.0-or-later AND GPL-3.0-or-later AND LGPL-2.1-or-later AND MIT AND BSD-2-Clause AND MPL-2.0 AND Watcom-1.0 AND Info-ZIP AND Artistic-1.0 AND GFDL-1.1-or-later AND Zlib AND LicenseRef-FreeDOS-other"
terms = "licenses"
source = "source"

[input.edition]
name = "FD14-FloppyEdition.zip"
size = 23624258
sha256 = "45b1fa7c52dd996c3bfa5e352ffcd410781b952a6ad629f15a4c9ec4bbaefc5a"
urls = [
    "https://download.freedos.org/1.4/FD14-FloppyEdition.zip",
    "https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/distributions/1.4/FD14-FloppyEdition.zip",
]

# The licence index, our own text: bundled with the recipe.
[input.licenses-lf]
name = "licenses.txt"
size = 9283
sha256 = "7467d0b4d07763a7fe160f0e4b098dee2f900cb10e830673127b19114cb61235"
bundle = true

# The corresponding source of every program on the disks, the installer and
# the release build environment: a prepared input, made by source/build.sh
# (which checks it against this pin) and published as a release asset of
# this repository.
[input.source]
name = "freedos-1.4-floppy-src.tar"
size = 22835200
sha256 = "dfa7006e742cb9676a0a6401ce64214089923f055f4a7ba8f36960115b5362b6"
urls = [
    "https://github.com/unemu-org/software/releases/download/freedos-1.4-floppy/freedos-1.4-floppy-src.tar",
]

[[step]]
id = "disks"
unpack = "edition"
format = "zip"
