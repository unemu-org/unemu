# Rule 4: an input and a step no output uses. The input behind a failed
# reference (bonus) is not reported again, nor is anything a step of two
# verbs names (extras). An input only an unused step reads (orphan) is
# reported with that step.
recipe = "1.0"

[media]
name = "private/media/ibm-pc/demo"
platform = "ibm-pc"
revision = 1

[title]
title = "Demo"

[input.disk]
name = "demo.img"
size = 1474560
sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

[input.spare]
name = "spare.img"
size = 1474560
sha256 = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"

[input.bonus]
name = "bonus.img"
size = 1474560
sha256 = "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"

[input.extras]
name = "extras.zip"
size = 1000
sha256 = "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"

[[step]]
id = "readme"
text = "disk"
eol = "crlf"

[input.orphan]
name = "orphan.txt"
size = 10
sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

# Read only by a step no output uses: both are reported.
[[step]]
id = "orphan-text"
text = "orphan"
eol = "crlf"

[[step]]
id = "both"
unpack = "extras"
text = "extras"

[[medium]]
id = "disk-1"
label = "Disk 1"
format = "1.44M"
from = "disk"

[[medium]]
id = "disk-2"
label = "Disk 2"
format = "1.44M"
from = "bonus/DISK2.IMG"
