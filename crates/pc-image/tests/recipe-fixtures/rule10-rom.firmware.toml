# Rule 10: a ROM whose size and hash differ from its catalogue entry, named
# by its id or known by its hash.
recipe = "1.0"

[firmware]
name = "private/firmware/ibm-pc/demo"
platform = "ibm-pc"
revision = 1

[package]
title = "Demo"

[input.rom]
name = "bios.bin"
size = 65536
sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

[[rom]]
id = "bios"
role = "system-bios"
catalogue_id = "ibm-5170-bios-1985-06-10"
from = "rom"

[input.wrong-size]
name = "bios-unemu-at.bin"
size = 65536
sha256 = "6938dc8b665fa120f33775163ab6bacc559389525db87adedf734416f9ef2442"

# Without catalogue_id, the ROM is known by its SHA-256.
[[rom]]
id = "by-hash"
role = "system-bios"
from = "wrong-size"

[[rom]]
id = "open-bios"
role = "system-bios"
catalogue_id = "unemu-at-bios-1.0.2-unemu.3"
size = 65536
sha256 = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
parts = [
    { lane = "even", from = "rom" },
]
