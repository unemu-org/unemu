# Rule 10: a volume label the volume would change (here, to upper case) is
# refused, never renamed.
recipe = "0.1"

[media]
name = "private/media/ibm-pc/demo"
platform = "ibm-pc"
revision = 1

[title]
title = "Demo"

[input.game]
name = "GAME"
files = [
    { path = "GAME.EXE", size = 10, sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" },
]

[[step]]
id = "disk"
fat = "game"
format = "1.44M"
label = "Game"

[[medium]]
id = "disk-1"
label = "Disk 1"
format = "1.44M"
from = "disk"
