# Rule 1: TOML 1.1 forms, which recipes refuse: a line break and a trailing
# comma in an inline table, the \x escape and a time without seconds.
recipe = "0.1"

[media]
name = "private/media/ibm-pc/demo"
platform = "ibm-pc"
revision = 1

[title]
title = "Demo"
description = "Demo \x41"

[input.archive]
name = "demo.zip"
size = 1000
sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

[[step]]
id = "files"
unpack = "archive"
format = "zip"
members = [
    { path = "README.TXT",
      time = 1993-03-27T13:58 },
    { path = "GAME.EXE", },
]

[[step]]
id = "disk"
fat = "files"
format = "1.44M"

[[medium]]
id = "disk-1"
label = "Disk 1"
format = "1.44M"
from = "disk"
