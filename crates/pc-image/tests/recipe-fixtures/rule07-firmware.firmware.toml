# Rule 7 for firmware: a role, a lane, a board, a machine class and a
# catalogue entry the provider does not know.
recipe = "0.1"

[firmware]
name = "private/firmware/ibm-pc/demo"
platform = "ibm-pc"
revision = 1

[package]
title = "Demo"

[package.fits]
boards = ["ibm-5170", "amiga-500"]
machine_classes = ["ps2"]

[input.u27]
name = "u27.bin"
size = 32768
sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

[input.u47]
name = "u47.bin"
size = 32768
sha256 = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"

[[rom]]
id = "bios"
role = "kickstart"
catalogue_id = "no-such-bios"
size = 65536
sha256 = "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
parts = [
    { lane = "even", from = "u27" },
    { lane = "high", from = "u47" },
]
