# Rule 10: names a volume refuses: lower case, a long name, a DOS device, a
# folder deeper than DOS can enter, and a label with a period.
recipe = "1.0"

[media]
name = "private/media/ibm-pc/demo"
platform = "ibm-pc"
revision = 1

[title]
title = "Demo"

[input.game]
name = "GAME"
files = [
    { path = "readme.txt", size = 10, sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" },
    { path = "LONGNAME1.TXT", size = 10, sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" },
    { path = "SUB/CON.TXT", size = 10, sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" },
    { path = "ABCDEFGH/ABCDEFGH/ABCDEFGH/ABCDEFGH/ABCDEFGH/ABCDEFGH/ABCDEFGH/ABCDEFGH/X.TXT", size = 10, sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" },
    { path = "GAME.EXE", size = 10, sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" },
]

[[step]]
id = "disk"
fat = "game"
format = "1.44M"
label = "GAME.V1"

[[medium]]
id = "disk-1"
label = "Disk 1"
format = "1.44M"
from = "disk"
