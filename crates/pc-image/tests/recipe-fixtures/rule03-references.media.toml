# Rule 3: names and references. A later step, no such value, a member of a
# file, a member the tree does not list, a tree where a file is wanted, a
# file where a tree is wanted, a value name and an output id used twice, a
# path listed twice, a DOS name used twice and a step that reads itself.
recipe = "0.1"

[media]
name = "private/media/ibm-pc/demo"
platform = "ibm-pc"
revision = 1

[title]
title = "Demo"

[input]
broken = 5

[input.archive]
name = "demo.zip"
size = 1000
sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

[input.notes]
name = "notes.txt"
size = 100
sha256 = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"

[[step]]
id = "files"
unpack = "archive"
format = "zip"
members = [
    { path = "README.TXT" },
    { path = "README.TXT" },
]

[[step]]
id = "early"
fat = "disk"
format = "1.44M"

[[step]]
id = "disk"
fat = "files"
format = "1.44M"

[[step]]
id = "notes"
text = "nothing"
eol = "crlf"

[[step]]
id = "wrong"
fat = "archive"
format = "1.44M"

[[step]]
id = "loop"
text = "loop"
eol = "crlf"

[[medium]]
id = "disk-1"
label = "Disk 1"
format = "1.44M"
from = "disk"

[[medium]]
id = "disk-1"
label = "Disk 2"
format = "1.44M"
from = "wrong"

[[extra]]
id = "readme"
file_name = "README.TXT"
dos_name = "README.TXT"
kind = "document"
from = "files/READ.ME"

[[extra]]
id = "notes-text"
file_name = "NOTES.TXT"
dos_name = "README.TXT"
kind = "document"
from = "archive/NOTES.TXT"

[[extra]]
id = "early-disk"
file_name = "EARLY.IMG"
kind = "other"
from = "early"

[[extra]]
id = "notes-file"
file_name = "NOTES"
kind = "other"
from = "notes"

[[extra]]
id = "loop-text"
file_name = "LOOP.TXT"
kind = "other"
from = "loop"

# A refused input is no file and no tree: nothing is said of a reference
# to it beyond its own finding.
[[extra]]
id = "broken-member"
file_name = "B.TXT"
kind = "other"
from = "broken/B.TXT"

[[extra]]
id = "all"
file_name = "ALL"
kind = "other"
from = "files"
