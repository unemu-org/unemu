# Rule 1: types and values outside their form: a float for an integer, an
# odd second, a leap second, an offset date-time, upper-case hex, a version that is not
# 0.1, a value outside a closed list and a disclosable file of 256 bytes.
recipe = "0.2"

[media]
name = "private/media/ibm-pc/demo"
platform = "ibm-pc"
revision = 0

[title]
title = "Demo"
players = { min = 2, max = 1 }

[input.archive]
name = "demo.zip"
size = 940242.0
sha256 = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"

[input.serial]
name = "serial.txt"
size = 256
sha256 = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
disclosable = true

[[step]]
id = "files"
unpack = "archive"
format = "rar"
members = [
    { path = "README.TXT", time = 1993-03-27T13:58:21 },
    { path = "GAME.EXE", time = 1993-03-27T13:58:22+01:00 },
    { path = "LEAP.TXT", time = 1993-03-27T13:58:60 },
]

[[step]]
id = "disk"
fat = "files"
format = "1.44M"

[[medium]]
id = "disk-1"
label = "Disk 1"
format = "1.44M"
from = "disk"

[[extra]]
id = "serial"
file_name = "SERIAL.TXT"
kind = "note"
from = "serial"
