# Rule 10: a stated size the medium's format does not allow, from an input
# and from an archive member.
recipe = "1.0"

[media]
name = "private/media/ibm-pc/demo"
platform = "ibm-pc"
revision = 1

[title]
title = "Demo"

[input.disk]
name = "demo.img"
size = 737281
sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

[input.cd]
name = "cd.zip"
size = 1000
sha256 = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"

[[step]]
id = "files"
unpack = "cd"
format = "zip"
members = [
    { path = "CD.ISO", size = 2049 },
]

[[medium]]
id = "disk-1"
label = "Disk 1"
format = "720K"
from = "disk"

[[medium]]
id = "cd"
label = "CD"
format = "iso-2048"
from = "files/CD.ISO"
