# Rule 10: a fat step whose format differs from the medium it feeds, as one
# volume and as a volume of a split.
recipe = "0.1"

[media]
name = "private/media/ibm-pc/demo"
platform = "ibm-pc"
revision = 1

[title]
title = "Demo"

[input.game]
name = "GAME"
files = [
    { path = "GAME.EXE", size = 1000, sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" },
]

[[step]]
id = "disk"
fat = "game"
format = "1.44M"

[[step]]
id = "disks"
fat = "game"
format = "1.2M"
volumes = 2

[[medium]]
id = "disk-1"
label = "Disk 1"
format = "720K"
from = "disk"

[[medium]]
id = "disk-2"
label = "Disk 2"
format = "360K"
from = "disks/2"

[[medium]]
id = "disk-3"
label = "Disk 3"
format = "1.2M"
from = "disks/1"
