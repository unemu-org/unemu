# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Frontend and golden runners for deterministic Real16 PC/AT machines (§3.1)."

[package.metadata.unemu]
layer = "application"

[[bin]]
name = "upcli"
path = "src/main.rs"

[dependencies]
pc-image = { path = "../pc-image", version = "0.0.2" }
image-store = { path = "../image-store", version = "0.0.2" }
image-registry = { path = "../registry", version = "0.0.2" }
# The platforms compiled in: their image providers and the licence notice.
platforms = { path = "../platforms", version = "0.0.2" }
toml.workspace = true
machine-file.workspace = true
anyhow.workspace = true
assembly.workspace = true
device.workspace = true
bus.workspace = true
cpu.workspace = true
chipset.workspace = true
machine.workspace = true
media.workspace = true
devices.workspace = true
video.workspace = true

# Terminal password entry: termios raw mode for `image login`.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
testkit.workspace = true
# The FAT12 reader that checks disks built from host files.
media = { workspace = true, features = ["test-support"] }
image-registry = { path = "../registry", version = "0.0.2", features = ["test-support"] }
# Tags an image as a newer release would, in a store both share.
image-store = { path = "../image-store", version = "0.0.2", features = ["test-support"] }
machine = { workspace = true, features = ["reference-scheduler"] }
assembly = { workspace = true, features = ["reference-scheduler", "test-support"] }
