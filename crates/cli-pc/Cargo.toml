[package]
name = "cli-pc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "The IBM PC/AT family's part of the command line: its machine runs, image, media and firmware commands, and its answers to the neutral commands (core-contract.md §7)."

[package.metadata.unemu]
layer = "pc"

[dependencies]
journal-files.workspace = true
unemupc = { path = "../unemupc", version = "0.0.3" }
cli-core = { path = "../cli-core", version = "0.0.3" }
core-launch = { path = "../core-launch", version = "0.0.3" }
unemu-core-api.workspace = true
unemu-pc-core.workspace = true
# The machine runners behind --boot, --bios and run.
pc-harness = { path = "../pc-harness", version = "0.0.3" }
pc-image = { path = "../pc-image", version = "0.0.3" }
image-store = { path = "../image-store", version = "0.0.3" }
image-registry = { path = "../registry", version = "0.0.3" }
recipe = { path = "../recipe", version = "0.0.3" }
toml.workspace = true
machine-file.workspace = true
anyhow.workspace = true
assembly.workspace = true
device.workspace = true
machine.workspace = true
media.workspace = true
video.workspace = true

[dev-dependencies]
pc-harness = { path = "../pc-harness", version = "0.0.3", features = ["test-support"] }
machine-file = { workspace = true, features = ["test-support"] }
pc-image = { path = "../pc-image", version = "0.0.3", features = ["test-support"] }
cpu.workspace = true
devices.workspace = true
# The FAT12 reader that checks disks built from host files.
media.workspace = true
image-registry = { path = "../registry", version = "0.0.3", features = ["test-support"] }
# Tags an image as a newer release would, in a store both share.
image-store = { path = "../image-store", version = "0.0.3", features = ["test-support"] }
assembly = { workspace = true, features = ["test-support"] }
