# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "ui-kit"
version.workspace = true
edition.workspace = true
# The crate embeds CC0 logo data and a Bitstream Vera licensed DejaVu Sans
# symbol subset alongside the AGPL source.
license = "AGPL-3.0-or-later AND CC0-1.0 AND Bitstream-Vera"
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "The desktop's skin and widget helpers: themes, fonts, icons, title strips, bevels, detail panes, file dialogs and clipboard shortcuts (§9)."

[package.metadata.unemu]
layer = "neutral"

[features]
# Scripted file dialogs and clipboards, the mock-up icon inventory and the
# helpers that drive egui frame by frame, for the tests of the crates that
# draw with this kit.
test-support = []

[dependencies]
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "gif"] }
rfd = { version = "=0.18.0", default-features = false, features = ["xdg-portal"] }
winit.workspace = true
# Paste reads the host clipboard with the arboard that eframe's clipboard
# already locks, so no new crate enters the build.
arboard = { version = "=3.7.0", default-features = false }

[dev-dependencies]
toml.workspace = true
