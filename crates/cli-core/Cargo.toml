# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "cli-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "The platform-neutral command line: its parser, usage text, exit codes, stored runs through the core contract and the provider seam of the platforms (core-contract.md §7)."

[package.metadata.unemu]
layer = "neutral"

[dependencies]
core-launch = { path = "../core-launch", version = "0.0.4" }
unemu-core-api.workspace = true
image-store = { path = "../image-store", version = "0.0.4" }
image-registry = { path = "../registry", version = "0.0.4" }
media.workspace = true
recipe = { path = "../recipe", version = "0.0.4" }
anyhow.workspace = true
toml.workspace = true
sha2.workspace = true

# Terminal password entry: termios raw mode for `image login`.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
unemu-test-core.workspace = true
unemu-core-api = { workspace = true, features = ["test-support"] }
# The mock registry of the push, pull and login tests.
image-registry = { path = "../registry", version = "0.0.4", features = ["test-support"] }
