# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "media-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "The desktop's PC media views, drawn with egui: the media picker, Create from files… and a floppy drive's Catalogue submenu (core-contract.md §8.1)."

[package.metadata.unemu]
layer = "pc"

[features]
# This crate's source folder, for the desktop's test that checks every drawn
# string's glyphs, and the picker's fixtures that the desktop's tests of the
# shell and the library build their sets and outcomes with.
test-support = []

[dependencies]
assembly.workspace = true
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
image-registry = { path = "../registry", version = "0.0.5" }
image-store = { path = "../image-store", version = "0.0.5" }
media.workspace = true
pc-image = { path = "../pc-image", version = "0.0.5" }
# The media models these views draw.
pc-media = { path = "../pc-media", version = "0.0.5" }
# The desktop's skin, icons and pane colours.
ui-kit = { path = "../ui-kit", version = "0.0.5" }

[dev-dependencies]
machine-file = { workspace = true, features = ["test-support"] }
assembly = { workspace = true, features = ["test-support"] }
ui-kit = { path = "../ui-kit", version = "0.0.5", features = ["test-support"] }
