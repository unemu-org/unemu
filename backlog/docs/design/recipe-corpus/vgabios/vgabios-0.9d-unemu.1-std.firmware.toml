# The unemu VGA BIOS 0.9d-unemu.1, standard VGA build, the video BIOS of
# unemupc's open AT templates: the firmware package
# unemu/firmware/ibm-pc/vgabios-0.9d-unemu.1-std:r1. The ROM and its source
# archive are release assets of github.com/unemu-org/vgabios v0.9d-unemu.1,
# taken unmodified (no step); both equal what unemupc's firmware catalogue
# pins for this id. The title, description, vendor, version and labels are
# unemupc's (pc_image::template::FIRMWARE), word for word. digest and the
# lock beside this file pin the package (docs/recipes.md).

recipe = "0.1"

[firmware]
name = "unemu/firmware/ibm-pc/vgabios-0.9d-unemu.1-std"
platform = "ibm-pc"
revision = 1
digest = "sha256:c1972247ba5fc03dee5bc011b137e49c547ef1f4fc32dc3f74fa09b205c235e7"

[package]
title = "unemu VGA BIOS 0.9d-unemu.1, standard VGA"
vendor = "unemu (fork of the LGPL VGABIOS project)"
version = "0.9d-unemu.1"
# The date: the ROM's own ID string, "vgabios.c 2026-08-07".
date = "2026-08-07"
labels = ["open-source", "pc-at", "vga", "video-bios"]
description = "The video BIOS of the open AT templates: the unemu fork of the LGPL VGABIOS 0.9d, the video BIOS Bochs and QEMU use, in its standard ISA VGA build with no VBE, PCI, Cirrus or Banshee code and 80286 instructions only. The 32 KiB ROM fills the C0000h-C7FFFh video-ROM window of an IBM 5170-class board with a register-level VGA card. Unlike upstream, teletype output sounds the PC speaker for BEL (07h): about 896 Hz for about 0.48 s, as the IBM PC/AT BIOS beeps. Licensed under LGPL-2.1-or-later; the package includes its corresponding source archive."

# What the catalogue records for the ROM, stated as it is.
[package.fits]
boards = ["ibm-5170"]
machine_classes = ["at"]

[license]
expression = "LGPL-2.1-or-later"
source = "source"

[input.rom]
name = "vgabios-std.bin"
size = 32768
sha256 = "b867f3846f44be63b1b10febc1ce79c9435f5d1233c67a0b63164ab48359a582"
urls = [
    "https://github.com/unemu-org/vgabios/releases/download/v0.9d-unemu.1/vgabios-std.bin",
]

[input.source]
name = "vgabios-0.9d-unemu.1-src.tar"
size = 604160
sha256 = "0f0890b6fc95156177c37725329ca8111b889abce33de73aeeaf2fc99ce86c48"
urls = [
    "https://github.com/unemu-org/vgabios/releases/download/v0.9d-unemu.1/vgabios-0.9d-unemu.1-src.tar",
]

[[rom]]
id = "video-bios"
role = "video-bios"
catalogue_id = "vgabios-0.9d-unemu.1-std"
from = "rom"

[[extra]]
id = "source"
