# Ken's Labyrinth 2.01, the full version (Epic MegaGames, 1993), released by
# Ken Silverman as freeware, with Epic MegaGames' permission, on 1999-11-16:
# the media set unemu/media/ibm-pc/kenslab:2.01-r1 (alias 2.01). The upstream
# release is an archive without disks, LABFULL.ZIP from the author's page
# (https://advsys.net/ken/klab.htm), so the fat step builds the set's one
# 1.44M diskette from all 19 files of the archive, unmodified, in the
# archive's order and with the archive's times. The version is the one the
# game displays, V2.01 on its title art (the author's page names the archive
# v2.1); "Full Version" is the edition README.TXT states, the work's primary
# edition, so the release has no edition part. The licence is the author's
# terms, README.TXT, carried unmodified; LICENSES.TXT is our licence index
# (licenses.txt, CC0-1.0). The terms are not copyleft: no source archive.
# What the releases of the work share is in kenslab.work.toml. digest and
# the lock beside this file pin the set (docs/recipes.md).

recipe = "0.1"
work = "kenslab"

[media]
name = "unemu/media/ibm-pc/kenslab"
platform = "ibm-pc"
release = "2.01"
revision = 1
digest = "sha256:1e34b66a682475182c0092cba2679c8da64e65160f91159a5c9ef3f944a40395"

[title]
version = "2.01"
edition = "Full Version"
# HELPME.DOC, "Requirements", word for word.
requirements = "IBM AT-Compatible computer (386 or 486 highly recommended); VGA Graphics; 512K of total memory (at least 365K available); About 1 megabyte of hard disk space"
year = 1993
labels = ["freeware"]
description = "Ken's Labyrinth 2.01, the full version of Ken Silverman's first-person shooter, published by Epic MegaGames in 1993: the aliens of the planet Zogar have taken your dog Sparky, and you go through their labyrinth in three episodes of ten levels. One 3.5-inch 1.44M diskette holds all 19 files of the author's LABFULL.ZIP, unmodified: the game (KEN.EXE); KENSBFIX.EXE, the author's 2008 build that fixes the 'Digitized Sound' crash and replaces KEN.EXE when Digitized Sound is enabled; SETUP.EXE; the game data; the manual (HELPME.DOC); the hint manual (HINTS.TXT); and four bonus saved games. Copy them to a hard disk, run SETUP, then KEN. Released by the author as freeware, with Epic MegaGames' permission, on 16 November 1999: it may be copied freely, but not sold, and only with all of its files (README.TXT, the set's licence text)."

[license]
expression = "LicenseRef-KensLabyrinth-Freeware"
terms = "readme"

[input.labfull]
name = "LABFULL.ZIP"
size = 940242
sha256 = "643aa0ca8d1a7d2c88afecd952da00f3b912be8b83c4c1d2f4ab9b50491fadfd"
urls = [
    "https://advsys.net/ken/klab/labfull.zip",
    "https://web.archive.org/web/20241128150708id_/https://advsys.net/ken/klab/labfull.zip",
    "https://web.archive.org/web/20131026024809id_/http://advsys.net/ken/klab/labfull.zip",
]

# The licence index, our own text: bundled with the recipe.
[input.licenses-lf]
name = "licenses.txt"
size = 3442
sha256 = "b4b52913919b8f481289fe0beef2a76a812b4014e6a2b09357caa2aec91f4ff7"
