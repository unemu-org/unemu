# Ken's Labyrinth, the work: what its releases share, and so what
# unemu/media/ibm-pc/kenslab says above its releases (unemupc's work files,
# its decision-39). Every value is cited; nothing is guessed.
#   synopsis  HELPME.DOC of LABFULL.ZIP (the input of kenslab-2.01.media.toml,
#             pinned by SHA-256), "ABOUT THE GAME": "a 3D arcade game
#             featuring high-res 256-color graphics, music, and digital
#             sound effects" in three episodes, The Search for Sparky,
#             Sparky's Revenge and Find the Way Home.
#   ids       wikidata: https://www.wikidata.org/wiki/Q3814453, label "Ken's
#             Labyrinth", description "1993 video game" (retrieved
#             2026-11-19); mobygames: that item's claim P1933 (MobyGames
#             game ID), "kens-labyrinth" (its P11688, the numeric MobyGames
#             id, is 388); igdb: its claim P5794 (IGDB game ID),
#             "kens-labyrinth" (both retrieved 2026-11-19).
#   needs     HELPME.DOC, "Requirements": an IBM AT-compatible computer, VGA
#             graphics, 512K of total memory; "Also supports": Sound Blaster
#             or AdLib, a joystick or Gravis Gamepad, a mouse, EMS and XMS.
#             Without SETUP the game "should work fine" with no music or
#             sound, hence none. PC speaker sound is not stated there.
# The labels game and first-person-shooter belong to the work; freeware is
# the 2.01 release's. A pinned recipe writes its lock's record, never this
# file's: an edit here reaches a published set only with a new pin
# (docs/recipes.md).

recipe = "0.1"

[work]
id = "kenslab"

[title]
title = "Ken's Labyrinth"
publishers = ["Epic MegaGames"]
developers = ["Ken Silverman", "Andy Cotter"]
genres = ["first-person shooter"]
software_platform = "DOS"
labels = ["game", "first-person-shooter"]
synopsis = "Ken Silverman's 3D arcade game of 1993, with 256-colour graphics, music and digital sound, in three episodes: The Search for Sparky, Sparky's Revenge and Find the Way Home."

[ids]
wikidata = "Q3814453"
mobygames = "kens-labyrinth"
igdb = "kens-labyrinth"

[needs]
cpu = "286+"
memory = "512K"
video = ["vga"]
sound = ["sb", "adlib", "none"]
input = ["joystick", "mouse", "none"]
