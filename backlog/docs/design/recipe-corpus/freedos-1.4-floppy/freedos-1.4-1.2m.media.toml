# FreeDOS 1.4 Floppy Edition, the 1.2M disks: unemu/media/ibm-pc/freedos:1.4-1.2m-r1.
# Open. The disks are the edition's images, unmodified, in installer order.
# Real data from unemu-media's media.toml and build.sh. Pinned: digest and the .lock folder beside it.

recipe = "0.1"
