name: CI

# The Forgejo runner's ubuntu-latest label is a node:20-bookworm container on
# x86-64 Linux, without systemd. Use the pinned Nix installer directly because
# the job runs as root without an init system.
#
# Actions resolve against the runner's default action mirror. Every gate keeps
# running after earlier failures; ci-logs/<step>.log and the final commit status
# (context "ci / x86_64") identify which gates failed.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (x86_64)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: never
    steps:
      # The pinned CPU dependency and its submodules are anonymously fetchable.
      # Do not leave the job token in .git/config next to unsandboxed builds.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Nix
        id: nix
        env:
          NIX_INSTALLER_DIAGNOSTIC_ENDPOINT: ""
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          # No daemon is needed with --init none: root uses the store directly.
          # The container does not grant the namespaces needed by the sandbox.
          {
            curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix/tag/v3.24.1 \
              | sh -s -- install linux --init none --no-confirm \
                  --extra-conf "sandbox = false" --extra-conf "filter-syscalls = false"
          } 2>&1 | tee ci-logs/nix.log
          echo /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"

      - name: Dev shell
        id: devshell
        if: ${{ !cancelled() }}
        run: bash scripts/ci-gate.sh devshell

      # Reuse compiled dependencies and Cargo's registry/git downloads across
      # source-only commits. The Nix and Cargo locks pin the cache's toolchain
      # and dependency graph; the explicit save also runs when a gate is red.
      - name: Restore cargo cache
        id: cargo_cache
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-x86_64-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-x86_64-${{ hashFiles('flake.lock') }}-

      # An explicit status function bypasses Actions' implicit success() check,
      # so one failed gate does not hide failures in the remaining gates.
      - name: Formatting
        id: fmt
        if: ${{ !cancelled() }}
        run: bash scripts/ci-gate.sh fmt

      - name: Publication guard
        id: guard
        if: ${{ !cancelled() }}
        run: bash scripts/ci-gate.sh guard

      - name: Clippy
        id: clippy
        if: ${{ !cancelled() }}
        run: bash scripts/ci-gate.sh clippy

      - name: Licences and dependency policy
        id: deny
        if: ${{ !cancelled() }}
        run: bash scripts/ci-gate.sh deny

      - name: Tests
        id: tests
        if: ${{ !cancelled() }}
        run: bash scripts/ci-gate.sh tests

      # Missing fixtures make the boot goldens skip. Build them with the devShell's
      # nasm and filesystem tools first; a fetch/build failure must fail the job.
      - name: Build golden fixtures
        id: fixtures
        if: ${{ !cancelled() }}
        run: bash scripts/ci-gate.sh fixtures

      - name: Slow goldens
        id: goldens
        if: ${{ !cancelled() }}
        run: bash scripts/ci-gate.sh goldens

      - name: Save cargo cache
        id: cache_save
        if: ${{ always() && steps.devshell.outcome == 'success' && steps.cargo_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-x86_64-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}

      - name: Report status
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/statuses/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          JOB_STATUS: ${{ job.status }}
          OUTCOMES: >-
            nix=${{ steps.nix.outcome }}
            devshell=${{ steps.devshell.outcome }}
            cargo_cache=${{ steps.cargo_cache.outcome }}
            fmt=${{ steps.fmt.outcome }}
            guard=${{ steps.guard.outcome }}
            clippy=${{ steps.clippy.outcome }}
            deny=${{ steps.deny.outcome }}
            tests=${{ steps.tests.outcome }}
            fixtures=${{ steps.fixtures.outcome }}
            goldens=${{ steps.goldens.outcome }}
            cache_save=${{ steps.cache_save.outcome }}
        run: |
          set -euo pipefail
          # node is part of the runner image. JSON encoding keeps arbitrary step
          # names safe, and the automatic token is used only for this API call.
          body=$(node <<'JS'
          const failed = process.env.OUTCOMES.trim().split(/\s+/)
            .filter(pair => pair.endsWith('=failure'))
            .map(pair => pair.split('=')[0]);
          const status = process.env.JOB_STATUS;
          const state = status === 'success' ? 'success' : status === 'cancelled' ? 'error' : 'failure';
          const description = status === 'success' ? 'all gate steps passed'
            : status === 'cancelled' ? 'job cancelled'
            : failed.length ? `failed: ${failed.join(', ')}` : 'job failed outside the gate steps';
          console.log(JSON.stringify({state, context: 'ci / x86_64', description,
            target_url: process.env.RUN_URL}));
          JS
          )
          # A reporting outage must not replace the gate results in the job log.
          if ! curl -sS --fail-with-body -X POST -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" --data "$body" "$API"; then
            echo 'status report failed; the job result stands' >&2
          fi
          printf '\n%s\n' "$body"
