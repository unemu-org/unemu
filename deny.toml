# SPDX-License-Identifier: AGPL-3.0-or-later

[licenses]
# Keep the allowlist limited to the all-features graph: workspace AGPL and
# permissive dependencies that can be distributed with it.
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://git.lab.mikolajczyk.org/unemu-org/x86jit"]
