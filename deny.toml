# SPDX-License-Identifier: AGPL-3.0-or-later

[advisories]
# cargo-deny 0.19 checks unmaintained crates across the full dependency graph.
# Keep its error defaults for vulnerabilities and yanked crates; only the
# documented advisory below is accepted until its review date.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "Accepted 2026-11-11: window -> winit -> sctk-adwaita -> ab_glyph -> owned_ttf_parser -> ttf-parser 0.25.1 provides Wayland client-side decorations, required for window frames on GNOME. This is an unmaintained crate, not a known vulnerability; no safe upgrade is available. Keep winit's default wayland-csd-adwaita feature. Review 2027-05-11." },
]

[licenses]
# Keep the allowlist limited to the all-features graph: workspace AGPL and
# permissive dependencies that can be distributed with it.
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # Permissive licenses of the windowed presenter's platform dependencies
    # (dynamic loading of the display libraries, Wayland window decorations).
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
]
confidence-threshold = 0.9

# The window presenter embeds unmodified CC BY-SA 4.0 font data; the license is
# allowed for that crate only, so no dependency can bring it in unnoticed.
[[licenses.exceptions]]
crate = "window"
allow = ["CC-BY-SA-4.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://git.lab.mikolajczyk.org/unemu-org/x86jit"]
