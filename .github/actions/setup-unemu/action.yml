# SPDX-License-Identifier: AGPL-3.0-or-later
name: Set up unemu
description: >-
  Install unemu, the desktop app and command line, from a GitHub release of
  unemu-org/unemu. The archive is checked against the release's SHA256SUMS
  before anything is unpacked, and unemu is added to PATH.

inputs:
  version:
    description: Release tag to install, for example v0.0.4.
    required: true
  commit:
    description: >-
      Full commit (40 lowercase hex digits) the release was built from. When
      set, the commit line of `unemu --version` must name it; a release that
      prints no commit line then fails.
    required: false
    default: ''

outputs:
  path:
    description: Absolute path of the installed unemu binary.
    value: ${{ steps.install.outputs.path }}

runs:
  using: composite
  steps:
    # The inputs reach the script only through the environment, never pasted
    # into the command, so no value can turn into shell code.
    - name: Install unemu
      id: install
      shell: bash
      env:
        UNEMU_VERSION: ${{ inputs.version }}
        UNEMU_COMMIT: ${{ inputs.commit }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
