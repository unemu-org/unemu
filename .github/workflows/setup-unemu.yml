# SPDX-License-Identifier: AGPL-3.0-or-later
name: setup-unemu

# Tests the setup-unemu action of this checkout on both platforms the releases
# cover: it packages the current binary, installs it through the action and
# runs command words, and refuses a
# release that does not exist. Every action is pinned to a
# full commit SHA; the comment names its release.
on:
  push:
    branches: [main]
    paths:
      - .github/actions/setup-unemu/**
      - .github/workflows/setup-unemu.yml
      - crates/**
      - Cargo.toml
      - Cargo.lock
  pull_request:
    paths:
      - .github/actions/setup-unemu/**
      - .github/workflows/setup-unemu.yml
      - crates/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-unemu-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
          - runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev

      - name: Build the current frontend
        env:
          UNEMUPC_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          cargo +1.99.1 build --locked -p window --bin unemu

      - name: Package the action test archive
        run: |
          fixture=$RUNNER_TEMP/setup-unemu-fixture
          bash .github/actions/setup-unemu/test-fixture.sh "$PWD/target/debug/unemu" "$fixture"
          echo "SETUP_UNEMU_FIXTURE=$fixture" >> "$GITHUB_ENV"
          expected=$(target/debug/unemu --version | sed -n '1p')
          echo "EXPECTED_UNEMU_VERSION=$expected" >> "$GITHUB_ENV"
          echo "$fixture/bin" >> "$GITHUB_PATH"

      # First, so that the check below also shows a failed install leaves no
      # unemu on PATH.
      - name: Install unemu from a release that does not exist
        id: wrong_hash
        continue-on-error: true
        uses: ./.github/actions/setup-unemu
        with:
          version: v0.0.0-missing

      - name: Check that the missing release was refused
        env:
          OUTCOME: ${{ steps.wrong_hash.outcome }}
          INSTALLED: ${{ steps.wrong_hash.outputs.path }}
        run: |
          set -euo pipefail
          if [[ $OUTCOME != failure ]]; then
            echo "::error::the action with a missing release ended in $OUTCOME, not failure"
            exit 1
          fi
          if [[ -n $INSTALLED ]] || command -v unemu; then
            echo '::error::the action with a missing release installed unemu'
            exit 1
          fi
          echo 'the missing release was refused and nothing was installed'

      - name: Install the current unemu archive
        id: setup
        uses: ./.github/actions/setup-unemu
        with:
          version: v0.0.0-test
          commit: ${{ github.sha }}

      - name: Run unemu
        env:
          INSTALLED: ${{ steps.setup.outputs.path }}
        run: |
          set -euo pipefail
          if [[ $(command -v unemu) != "$INSTALLED" ]]; then
            echo "::error::unemu on PATH is not the binary the action names in its path output"
            exit 1
          fi
          for notice in LICENSE THIRD-PARTY-LICENSES.md; do
            if [[ ! -f $(dirname "$INSTALLED")/$notice ]]; then
              echo "::error::$notice is not installed next to unemu"
              exit 1
            fi
          done
          about=$(unemu --version)
          printf '%s\n' "$about"
          if [[ ${about%%$'\n'*} != "$EXPECTED_UNEMU_VERSION" ]]; then
            echo '::error::the installed binary does not match the current build'
            exit 1
          fi
          unemu media create floppy --type 360K "$RUNNER_TEMP/dispatch.img" --format
          test "$(wc -c < "$RUNNER_TEMP/dispatch.img" | tr -d ' ')" = 368640
