# SPDX-License-Identifier: AGPL-3.0-or-later
name: setup-upcli

# Tests the setup-upcli action of this checkout on both platforms the releases
# cover: it installs the v0.0.1 release and runs upcli, and it refuses a
# release that does not exist. Every action is pinned to a
# full commit SHA; the comment names its release.
on:
  push:
    branches: [main]
    paths:
      - .github/actions/setup-upcli/**
      - .github/workflows/setup-upcli.yml
  pull_request:
    paths:
      - .github/actions/setup-upcli/**
      - .github/workflows/setup-upcli.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-upcli-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # First, so that the check below also shows a failed install leaves no
      # upcli on PATH.
      - name: Install upcli from a release that does not exist
        id: wrong_hash
        continue-on-error: true
        uses: ./.github/actions/setup-upcli
        with:
          version: v0.0.0-missing

      - name: Check that the missing release was refused
        env:
          OUTCOME: ${{ steps.wrong_hash.outcome }}
          INSTALLED: ${{ steps.wrong_hash.outputs.path }}
        run: |
          set -euo pipefail
          if [[ $OUTCOME != failure ]]; then
            echo "::error::the action with a missing release ended in $OUTCOME, not failure"
            exit 1
          fi
          if [[ -n $INSTALLED ]] || command -v upcli; then
            echo '::error::the action with a missing release installed upcli'
            exit 1
          fi
          echo 'the missing release was refused and nothing was installed'

      - name: Install upcli v0.0.1
        id: setup
        uses: ./.github/actions/setup-upcli
        with:
          version: v0.0.1

      - name: Run upcli
        env:
          INSTALLED: ${{ steps.setup.outputs.path }}
        run: |
          set -euo pipefail
          if [[ $(command -v upcli) != "$INSTALLED" ]]; then
            echo "::error::upcli on PATH is not the binary the action names in its path output"
            exit 1
          fi
          for notice in LICENSE THIRD-PARTY-LICENSES.md; do
            if [[ ! -f $(dirname "$INSTALLED")/$notice ]]; then
              echo "::error::$notice is not installed next to upcli"
              exit 1
            fi
          done
          about=$(upcli --version)
          printf '%s\n' "$about"
          if [[ ${about%%$'\n'*} != 'upcli 0.0.1' ]]; then
            echo '::error::upcli --version does not start with "upcli 0.0.1"'
            exit 1
          fi
